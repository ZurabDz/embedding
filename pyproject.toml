[project]
name = "geo-embeddings"
version = "0.1.0"
description = "Georgian sentence embeddings: MLM pretraining (lm/) + Gemini teacher distillation (geo_distill/)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ka-mlm",
    "geo-distill",
]

[project.optional-dependencies]
# Passthrough so `uv sync --extra local-teacher` works from the workspace root.
local-teacher = ["geo-distill[local-teacher]"]

[dependency-groups]
dev = [
    "pytest>=8",
    "scipy>=1.11",   # tests only: reference implementation for the metrics
    "jupyter>=1.1",
    "notebook>=7",
]

[tool.uv]
# The root is a virtual project: `uv sync` here installs both workspace
# members editable plus the dev group; the members are the real packages.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end subprocess pipelines (run with -m slow)"]
addopts = "-m 'not slow'"

[tool.uv.workspace]
members = ["lm", "geo_distill"]

[tool.uv.sources]
ka-mlm = { workspace = true }
geo-distill = { workspace = true }
